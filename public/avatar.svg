<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="shirtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#bgGradient)"/>

  <!-- Glowing accent arc -->
  <circle cx="128" cy="128" r="122" fill="none" stroke="url(#ringGradient)" stroke-width="4" opacity="0.8"/>

  <!-- Character / Stylized Developer Portrait -->
  <g id="character">
    <!-- Body / Shoulders -->
    <path d="M48 240 C48 185, 80 165, 128 165 C176 165, 208 185, 208 240 Z" fill="url(#shirtGradient)"/>
    
    <!-- Collar details -->
    <path d="M110 165 L128 185 L146 165 Z" fill="#1e40af" opacity="0.6"/>

    <!-- Neck -->
    <rect x="114" y="140" width="28" height="28" rx="6" fill="#fed7aa"/>

    <!-- Head / Face -->
    <ellipse cx="128" cy="115" rx="42" ry="48" fill="url(#skinGradient)"/>

    <!-- Hair -->
    <path d="M84 105 C84 65, 100 50, 128 50 C156 50, 172 65, 172 105 C172 110, 168 112, 165 102 C160 85, 148 76, 128 76 C108 76, 96 85, 91 102 C88 112, 84 110, 84 105 Z" fill="#1c1917"/>

    <!-- Modern Glasses -->
    <rect x="94" y="102" width="28" height="20" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
    <rect x="134" y="102" width="28" height="20" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
    <line x1="122" y1="110" x2="134" y2="110" stroke="#0f172a" stroke-width="4"/>

    <!-- Eyes inside glasses -->
    <circle cx="108" cy="112" r="3.5" fill="#0f172a"/>
    <circle cx="148" cy="112" r="3.5" fill="#0f172a"/>

    <!-- Eyebrows -->
    <path d="M96 95 Q108 92 118 95" fill="none" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M138 95 Q148 92 160 95" fill="none" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M116 138 Q128 147 140 138" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Coding Accent Overlay Icon (< / >) badge at bottom corner -->
  <g transform="translate(180, 180)">
    <circle cx="24" cy="24" r="22" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="24" y="29" font-family="monospace" font-size="15" font-weight="bold" fill="#60a5fa" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
